# ALLO BRIS DE GLACE - production routing

# Block sensitive files/directories
location ~ /\\.(?!well-known) {
    deny all;
}

location ~* ^/(?:backend|deploy|tests|memory|test_reports|\\.git)(?:/|$) {
    deny all;
}

location ~* \\.(?:env|ini|log|sql|bak|backup)$ {
    deny all;
}

# API -> FastAPI
location /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
}

# Frontend static assets
location /assets/ {
    alias /var/www/allobrisdeglace.com/frontend/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# Site files
location = /favicon.svg {
    alias /var/www/allobrisdeglace.com/frontend/dist/favicon.svg;
    expires 30d;
}

location = /robots.txt {
    alias /var/www/allobrisdeglace.com/frontend/dist/robots.txt;
}

location = /sitemap.xml {
    alias /var/www/allobrisdeglace.com/frontend/dist/sitemap.xml;
}

# Homepage
location = / {
    root /var/www/allobrisdeglace.com/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
}

# Clean URL pages
