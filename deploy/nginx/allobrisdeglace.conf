# ALLO BRIS DE GLACE — configuration Nginx de production
#
# Environnement actuel : TinyCP + Nginx.
# Le domaine est servi depuis /var/www/allobrisdeglace.com.
# Les règles spécifiques du site sont chargées via .nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name allobrisdeglace.com www.allobrisdeglace.com;
    return 301 https://allobrisdeglace.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.allobrisdeglace.com;

    ssl_certificate     /opt/tinycp/domains/allobrisdeglace.com/ssl/ssl-BriseSSL.crt;
    ssl_certificate_key /opt/tinycp/domains/allobrisdeglace.com/ssl/ssl-BriseSSL.key;

    return 301 https://allobrisdeglace.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name allobrisdeglace.com;

    ssl_certificate     /opt/tinycp/domains/allobrisdeglace.com/ssl/ssl-BriseSSL.crt;
    ssl_certificate_key /opt/tinycp/domains/allobrisdeglace.com/ssl/ssl-BriseSSL.key;

    root /var/www/allobrisdeglace.com/frontend/dist;
    index index.html;

    include /var/www/allobrisdeglace.com/.nginx.conf;
}
